name: Build EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kütüphaneleri kur
        run: python -m pip install pyinstaller pillow pymupdf pdf2docx pywin32 openpyxl python-docx

      - name: ffmpeg indir
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ffx -Force
          Copy-Item (Get-ChildItem ffx -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName .\ffmpeg.exe

      - name: EXE derle
        run: python -m PyInstaller --onefile --noconsole --name EvrenselDonusturucu --add-binary "ffmpeg.exe;." --collect-all pdf2docx --collect-data docx --hidden-import fitz --hidden-import win32com.client --hidden-import pythoncom --hidden-import pywintypes converter.py

      - name: EXE dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: EvrenselDonusturucu
          path: dist/EvrenselDonusturucu.exe
